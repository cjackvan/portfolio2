<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlie Van</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="contact">
    <p>Charlie Van</p>
    <p>Vancouver BC</p>
    <p class="spacer">&nbsp;</p>
    <p><a href="mailto:cjackvan@gmail.com">cjackvan@gmail.com</a></p>
    <p><a href="tel:+16043296273">(604)-329-6273</a></p>
  </header>

  <main class="gallery">
    <figure class="project project-rubber-match">
      <button type="button" class="project-trigger" aria-label="View Rubber Match">
        <img
          src="images/Rubbermatch.jpg"
          alt="Rubber Match"
        >
        <figcaption>Rubber Match, 2020</figcaption>
      </button>
      <div class="project-detail" hidden>
        <button type="button" class="back-button" aria-label="Back">&lt;</button>
        <p class="project-blurb">
          Thesis project at Emily Carr University of Art + Design, class of 2020.
          A modular synthesizer with no labels on inputs, outputs, switches, or knobs.
          Players navigate the interface in a feedback-driven process of exploration,
          human/non-human collaboration, and music-making.
        </p>
      </div>
    </figure>

    <figure class="project project-grids">
      <button type="button" class="project-trigger" aria-label="View Mapping and Measurement 1">
        <img
          src="images/grids2.jpg"
          alt="Mapping and Measurement 1"
        >
        <figcaption>Mapping &amp; Measurement 1 (WIP), 2026</figcaption>
      </button>
      <div class="project-detail" hidden>
        <button type="button" class="back-button" aria-label="Back">&lt;</button>
        <p class="project-blurb">
          <em>Mapping &amp; Measurement 1</em> Current work in progress exploring <em>Operational Images</em>, machine-machine visual culture, and systems of measurement. 
        </p>
      </div>
    </figure>

    <figure class="project project-liedetector">
      <button type="button" class="project-trigger" aria-label="View It Was an Accident After All">
        <img
          src="images/liedetector.JPG"
          alt="It Was an Accident After All"
        >
        <figcaption>It Was an Accident After All, 2026</figcaption>
      </button>
      <div class="project-detail" hidden>
        <button type="button" class="back-button" aria-label="Back">&lt;</button>
        <p class="project-blurb">
          In researching the materials of conspiracy, transparency, and immediacy,
          <em>It Was an Accident After All</em> staged a reenactment of a contested narrative
          surrounding the invention of the bipolar junction transistor, in which
          laboratory staff were subjected to polygraph examination at Shockley
          Semiconductor in Mountain View, 1957.
        </p>
      </div>
    </figure>

    <figure class="project project-fbyha">
      <button type="button" class="project-trigger" aria-label="View F by HA Synthesizer Modules">
        <img
          src="images/FbyHA.png"
          alt="F by HA Synthesizer Modules"
        >
        <figcaption>F by HA Synthesizer Modules, 2024</figcaption>
      </button>
      <div class="project-detail" hidden>
        <button type="button" class="back-button" aria-label="Back">&lt;</button>
        <p class="project-blurb">
          A series of synthesizer modules designed and produced under the mentorship
          of Andrew Kilpatrick of Kilpatrick Audio.
        </p>
      </div>
    </figure>

    <figure class="project project-pma">
      <button type="button" class="project-trigger" aria-label="View The Postmakerly Alibi">
        <img
          src="images/PMA2.png"
          alt="The Postmakerly Alibi"
        >
        <figcaption>The Postmakerly Alibi, 2025</figcaption>
      </button>
      <div class="project-detail" hidden>
        <button type="button" class="back-button" aria-label="Back">&lt;</button>
        <p class="project-blurb">
          <em>The Postmakerly Alibi</em> is a response to Kipum Lee&rsquo;s <em>Design as Institutioning:
          Shaping Temporality and Agency in Organizations and Human Systems</em>. Drawing on
          Mike Pepi&rsquo;s critique of digital mythologies and Byung-Chul Han&rsquo;s concept
          of <em>Non-things</em>, the booklet argues that in its championing of platforms,
          postmakerliness obscures material infrastructures and realities while
          simultaneously making untenable the narrative and durational qualities that
          constitute Lee&rsquo;s notion of institutional &ldquo;Simultaneous Time.&rdquo;
          <br><br>
          Edition of 3, B/W laser-printed on grey paper, saddle-stapled. Colour
          laser-printed vellum inserts.
        </p>
      </div>
    </figure>
  </main>

  <script src="script.js"></script>
</body>
</html>
